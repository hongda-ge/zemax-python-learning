# Day 35：把 Day29-Day34 的审计工具封装成项目维护运行手册。
schema_version: "maintenance_runbook/v1"

case:
  id: "day35_teaching_maintenance_runbook_v1"
  name: "证据驱动的项目维护运行手册"
  status: "draft"

teaching_introduction:
  why_today: "Day29-Day34分别解决了维护环节；Day35把它们串成一条可重复、可审批、可停止的完整流程。"
  relation_to_previous_day: "Day34提供失败传播和分支隔离规则；Day35将其作为维护流程的最终安全门。"
  concepts:
    - "运行手册：把入口、证据、操作、审批和停止条件写成固定步骤"
    - "证据门：上一步证据未通过时，不释放下一步"
    - "恢复条件：修复失败证据并重新验证后，BLOCKED节点才可重新进入复核"
  completion_standard: "六份冻结证据指纹全部匹配，十个检查点覆盖完整维护链，手册不自动执行任何科学任务。"

execution:
  enabled: false
  allow_zosapi_connection: false
  allow_model_copy: false
  allow_new_optical_calculation: false
  allow_runbook_generation: true
  allow_automatic_execution: false
  allow_existing_source_modification: false

