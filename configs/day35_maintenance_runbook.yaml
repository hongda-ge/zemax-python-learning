maintenance_policy:
  registry_is_entrypoint: true
  fingerprints_checked_before_interpretation: true
  impact_scope_approved_before_rerun: true
  dependency_order_preserved: true
  resource_capacity_applied_after_dependency_order: true
  manual_gate_after_each_resource_slot: true
  failure_blocks_only_transitive_descendants: true
  reviewable_branch_requires_manual_resume: true
  blocked_nodes_require_repaired_upstream_evidence: true
  automatic_scientific_rerun_allowed: false

checkpoints:
  - id: "CP01_change_intake"
    stage: "intake"
    title: "记录变化对象与变化原因"
    evidence_role: "experiment_registry"
    pass_condition: "变化对象能够映射到已登记Day或明确标记为新实验"
    fail_action: "停止并补充登记信息"
  - id: "CP02_registry_lookup"
    stage: "intake"
    title: "核对配置、脚本和学习笔记"
    evidence_role: "experiment_registry"
    pass_condition: "目标Day的核心资产路径完整"
    fail_action: "停止并修复资产缺口"
  - id: "CP03_fingerprint_gate"
    stage: "provenance"
    title: "验证冻结证据指纹"
    evidence_role: "evidence_dependency_graph"
    pass_condition: "所引用报告SHA256与配置一致"
    fail_action: "禁止解释旧报告并重新审核来源"
  - id: "CP04_dependency_trace"
    stage: "scope"
    title: "追踪直接与传递下游"
    evidence_role: "evidence_dependency_graph"
    pass_condition: "依赖图无环且变化节点存在"
    fail_action: "停止并修复依赖定义"
  - id: "CP05_impact_scope"
    stage: "scope"
    title: "形成保守复核集合"
    evidence_role: "change_impact_analysis"
    pass_condition: "变化源与所有传递下游已纳入且无关祖先被排除"
    fail_action: "停止并重新计算影响集合"
  - id: "CP06_scope_approval"
    stage: "approval"
    title: "人工批准复核范围"
    evidence_role: "change_impact_analysis"
    pass_condition: "维护者确认需要复核的ZOS-API与离线节点"
    fail_action: "保持所有任务未运行"
  - id: "CP07_dependency_waves"
    stage: "ordering"
    title: "生成依赖安全波次"
    evidence_role: "dependency_ready_waves"
    pass_condition: "每个节点恰好一次且所有依赖边指向更晚波次"
    fail_action: "停止并检查DAG或波次算法"
  - id: "CP08_resource_schedule"
    stage: "scheduling"
    title: "应用资源容量并生成顺序槽"
    evidence_role: "resource_feasible_schedule"
    pass_condition: "每槽最多一个ZOS-API任务和两个离线任务"
    fail_action: "停止并重新拆分资源槽"
  - id: "CP09_slot_gate"
    stage: "execution_gate"
    title: "每槽结束后人工审核"
    evidence_role: "resource_feasible_schedule"
    pass_condition: "本槽证据完整、指纹稳定且复核结果通过"
    fail_action: "不得释放后续依赖节点"
  - id: "CP10_failure_recovery"
    stage: "recovery"
    title: "隔离失败分支并定义恢复条件"
    evidence_role: "failure_gate_propagation"
    pass_condition: "FAIL、BLOCKED与REVIEWABLE分区完整且恢复需人工批准"
    fail_action: "维持下游锁定并修复失败上游证据"

validation:
  require_all_source_hashes_match: true
  require_unique_source_roles: true
  require_checkpoint_ids_unique: true
  require_all_source_roles_used: true
  require_exact_checkpoint_count: 10
  require_manual_gate_and_recovery: true
  real_execution_claim_allowed: false
  automatic_rerun_allowed: false
  hidden_completion_score_allowed: false
  engineering_approval_claim_allowed: false

planned_outputs_after_approval:
  root: "outputs/day35_maintenance_runbook"
  json: "maintenance_runbook.json"
  csv: "maintenance_checkpoints.csv"
  markdown: "PROJECT_MAINTENANCE_RUNBOOK.md"
  figure: "day35_maintenance_runbook.png"
