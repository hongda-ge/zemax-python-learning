teaching_introduction:
  why_today: "Day61证明零偏移控制可完整复现；Day62需要用最小权限决定是否释放九个非零边界案例。"
  relation_to_previous_day: "输入是Day61的CP09控制审核记录；今天只签发九案例批次授权，不连接Zemax、不计算新光学结果。"
  concepts:
    - "分段授权：零偏移控制通过后，九个边界案例仍需单独审批"
    - "批次契约：冻结案例身份、偏移顺序、分析配方、输出边界和停止条件"
    - "异常与验收分离：执行异常停止批次，均衡验收FAIL只记录"
    - "逐槽门控：完成九案例后仍停在CP09，不能自动释放Slot5-6"
  completion_standard: "审批绑定Day61记录、九个偏移、冻结Day25配置和模型；只允许Day63串行执行一次九案例批次，Quick Focus、优化、SaveAs、控制重跑及Slot5-6继续锁定。"

