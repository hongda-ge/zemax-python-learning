# Day 46：审核 Day45 隔离候选，但不释放 Slot 1 执行权限。
schema_version: "candidate_pre_execution_review/v1"

case:
  id: "day46_candidate_pre_execution_review_v1"
  name: "Day22隔离候选的执行前审核"
  status: "draft"

teaching_introduction:
  why_today: "Day45已经创建候选和清单；Day46需要独立核对候选身份、唯一差异和权限锁，避免未经审核的文件进入复核。"
  relation_to_previous_day: "输入是Day45候选、双指纹和执行前清单；今天只判断候选能否提交Slot 1执行审批，不运行Day22。"
  concepts:
    - "执行前审核：在批准计算前重新验证输入文件及其证据"
    - "证据绑定：审核结论必须绑定候选路径、来源SHA256和候选SHA256"
    - "资格与授权分离：候选具备申请资格，不等于已经获得执行权限"
    - "权限继承：Day45中的正式配置、ZOS-API和下游槽锁必须继续保留"
  completion_standard: "Day44审批、Day45清单、正式配置和候选指纹均有效；候选只有一个声明差异；结论仅为等待Slot 1执行审批，所有计算继续锁定。"

