    - "重试授权消费：连接前写入新的消费标记，Day69旧授权始终不可复用"
    - "API恢复验证：成功建立Standalone连接才构成许可证恢复证据"
    - "双路径结果：成功时复现Spot/MTF，失败时记录异常和模型安全状态"
    - "单次停止：成功或失败都立即停在CP09，不自动执行第二次尝试或七点批次"
  completion_standard: "只消费一次Day72审批并尝试一个0mm控制；成功时复现历史Spot/MTF并关闭连接，失败时保存完整异常证据；两种结果均保持模型不变并锁定七点批次、Day27重算和Slot 6。"

