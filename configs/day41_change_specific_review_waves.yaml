# Day 41：为已批准的 Day22-Day28 正式范围生成专用依赖复核波次。
schema_version: "change_specific_review_waves/v1"

case:
  id: "day41_day22_change_review_waves_v1"
  name: "Day22教学变化的依赖安全复核波次"
  status: "draft"

teaching_introduction:
  why_today: "Day40只批准了正式范围用于规划；Day41需要把七个节点按依赖先后拆成可以逐步释放的复核波次。"
  relation_to_previous_day: "输入是Day40批准的Day22-Day28范围，依赖关系来自Day30 DAG；今天不修改Day22，也不执行任何节点。"
  concepts:
    - "诱导子图：只保留正式复核范围中的节点及它们之间的依赖边"
    - "依赖就绪：一个节点的所有受影响上游都完成后，它才进入下一可用波次"
    - "同波独立：同一波节点之间不存在受影响依赖边"
    - "理论并行：同波只表示依赖允许，不代表许可证和资源允许同时执行"
  completion_standard: "七个节点恰好出现一次，Day22独占首波，全部受影响依赖边从早波指向晚波；执行类别保留且没有任务被批准或执行。"

