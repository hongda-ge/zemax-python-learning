# Day 43：为 Day42 的变化专用资源槽设计人工审批门和假想失败传播。
schema_version: "change_specific_failure_gates/v1"

case:
  id: "day43_day22_change_failure_gates_v1"
  name: "Day22教学变化的逐槽审批与失败传播"
  status: "draft"

teaching_introduction:
  why_today: "Day42给出了六个资源槽，但还没有规定某个复核失败后哪些下游必须锁定。"
  relation_to_previous_day: "输入是Day42的变化专用调度；失败传播由Day30科学依赖图决定，不能把同槽关系误当成依赖关系。"
  concepts:
    - "逐槽审批：一个槽完成并经人工确认后，才考虑释放后续可用槽"
    - "失败传播：FAIL节点在正式依赖图中的传递下游变为BLOCKED"
    - "同槽隔离：同处一个槽但不依赖失败节点的任务不应被自动判为失败"
    - "可继续复核：未完成且不依赖失败证据的任务保持REVIEWABLE"
  completion_standard: "四个假想演练的PASS、FAIL、BLOCKED和REVIEWABLE互斥且覆盖七个节点；Day26与Day27的同槽分支被正确隔离，所有状态明确标记为SIMULATED。"

