  assume_nonfailed_tasks_in_completed_slot_pass: true
  fail_node_status: "FAIL"
  transitive_descendant_status: "BLOCKED"
  unaffected_future_status: "REVIEWABLE"
  completed_nonfailed_status: "PASS"
  simulated_state_label: "SIMULATED"
  blocked_and_reviewable_are_not_run: true
  stop_failed_branch_not_global_schedule: true
  same_slot_is_not_dependency: true
  manual_approval_required_to_resume: true

