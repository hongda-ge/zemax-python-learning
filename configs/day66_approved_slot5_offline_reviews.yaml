# Day 66：消费 Day65 一次性审批，执行 Slot 5 的两个离线复核。
schema_version: "approved_slot5_offline_reviews/v1"

case:
  id: "day66_approved_slot5_offline_reviews_v1"
  name: "获批的Slot 5 Day26与Day27离线复核"
  status: "approved_for_one_execution"

teaching_introduction:
  why_today: "Day65已经签发一次Slot 5离线复核权限；Day66需要消费该权限，分别处理Day26可计算任务和Day27证据不足任务。"
  relation_to_previous_day: "输入是Day65审批绑定的0.012mm变化和16个实测点；今天不连接Zemax，只进行停止准则重算与精确证据可用性审计。"
  concepts:
    - "授权消费：执行前写入一次性标记，防止同一审批被重复使用"
    - "任务状态分层：程序包成功不代表其中每个科学任务都有足够证据完成"
    - "阻塞证据：缺少精确端点时记录缺口，不把未知状态伪装为FAIL"
    - "同槽分支隔离：Day27阻塞不影响独立Day26结果的完成状态"
  completion_standard: "Day26用0.012mm完成三策略复核；Day27逐命令列出所需和缺失点并进入阻塞状态；审批只消费一次，不插值、不连接ZOS-API，Slot 6继续锁定并等待CP09。"

