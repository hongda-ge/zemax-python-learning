  day30_graph_sha256: "3B45DB6A09B62A9331EE32B252C9173607A57C9CE9DE6D11BF0C5665DF025B5D"

wave_policy:
  use_induced_review_subgraph: true
  treat_unaffected_upstream_as_already_available: true
  start_with_changed_source: true
  release_node_only_after_all_affected_upstream_complete: true
  allow_same_wave_only_without_affected_dependency: true
  preserve_execution_class_labels: true
  theoretical_parallelism_only: true

expected_scenarios:
  change_day8_foundation_evidence:
    review_node_count: 21
    wave_count: 15
    maximum_wave_width: 3
  change_day22_error_budget:
    review_node_count: 7
    wave_count: 6
    maximum_wave_width: 2
  change_day27_envelope_report:
    review_node_count: 2
    wave_count: 2
    maximum_wave_width: 1

validation:
  require_day31_hash_match: true
  require_day30_hash_match: true
  require_every_review_node_exactly_once: true
  require_all_affected_edges_forward_across_waves: true
  require_changed_source_in_first_wave: true
  hidden_priority_score_allowed: false
  resource_parallelism_claim_allowed: false
  automatic_execution_allowed: false

