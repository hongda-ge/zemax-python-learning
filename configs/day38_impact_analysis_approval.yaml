# Day 38：审查 Day37 变化申请，并只批准进入正式影响分析。
schema_version: "impact_analysis_approval/v1"

case:
  id: "day38_teaching_impact_analysis_approval_v1"
  name: "Day37变化申请的分级人工审批"
  status: "draft"

teaching_introduction:
  why_today: "Day37已经把变化内容记录完整；Day38需要明确审批究竟释放哪一步，防止一次批准同时越过分析、修改和执行三道边界。"
  relation_to_previous_day: "输入是Day37的WAITING_FOR_APPROVAL申请；今天只审查是否允许进入正式影响分析，不接受申请人预估范围作为最终结论。"
  concepts:
    - "分级授权：批准分析、批准修改、批准执行是三个不同权限"
    - "审批对象：审批必须绑定申请编号和SHA256，避免批准错版本"
    - "批准条件：申请完整、目标未变化、边界和回滚方式清楚"
    - "最小权限：本次只释放影响分析，不释放源文件修改和历史任务执行"
  completion_standard: "Day37申请和Day22目标指纹匹配，审批结论仅为APPROVED_FOR_IMPACT_ANALYSIS，Day22保持不变，ZOS-API、配置修改和任务执行仍被禁止。"

