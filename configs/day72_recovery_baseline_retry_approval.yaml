  name: "Day27证据恢复零偏移控制重试审批"
  status: "draft"

teaching_introduction:
  why_today: "Day71确认Day70在光学分析前安全失败，并允许申请新重试审批；Day72需要用最小权限签发一次新的零偏移控制重试授权。"
  relation_to_previous_day: "输入是Day71许可证失败审核、不可复用的Day69消费标记和冻结光学基线；今天只生成审批，不连接Zemax。"
  concepts:
    - "新授权替代重用：Day69授权已经消费，重试必须绑定新的决策编号和指纹"
    - "恢复验证分层：GUI可用是操作者观察，Standalone连接是否恢复只能由Day73验证"
    - "最小重试范围：只允许一个0mm控制、一个工作副本和一个连接生命周期"
    - "失败仍需闭环：若重试再次失败，授权仍被消费，并必须重新进入CP09审核"
  completion_standard: "审批绑定Day71审核、原失败证据、原消费标记、冻结模型和历史控制；只释放Day73一次零偏移重试，七点恢复批次、Day27重算和Slot 6继续锁定。"

