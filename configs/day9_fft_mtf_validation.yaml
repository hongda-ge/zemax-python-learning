# Day 9 cross-validation of the Day 8 near-best plateau with FFT MTF.

schema_version: "fft_mtf_candidate_validation/v1"

case:
  id: "cooke_surface2_plateau_fft_mtf_v1"
  name: "Cooke面2空气间隔近优平台FFT MTF交叉验证"
  status: "draft"

execution:
  enabled: false
  plan_allow_zosapi_connection: false
  allow_single_baseline_validation: true
  allow_reviewed_candidate_execution: true

source:
  baseline_config: "configs/baseline_case.yaml"
  day8_output_root: "outputs/day8_local_fine_scan"
  day8_report_name: "day8_local_robustness_report.json"

selection:
  source_rule: "day8_5_percent_mean_rms_plateau"
  expected_candidate_count: 4
  require_best_sampled_case: true

analysis:
  type: "FFT_MTF"
  inherit_settings_from: "analysis.fft_mtf"
  evaluation_frequencies_cyc_per_mm: [30.0, 50.0]
  components: ["tangential", "sagittal"]
  fields: "all"
  wavelengths: "all"
  surface: "image"
  polarization: false

guardrails:
  require_day8_success: true
  require_saved_model_hash_match: true
  require_source_unchanged: true
  require_working_copy_unchanged: true
  require_connection_closed: true
  do_not_refocus_day8_models: true
  do_not_modify_day8_models: true

output:
  root: "outputs/day9_fft_mtf_validation"
