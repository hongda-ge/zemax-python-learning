teaching_introduction:
  why_today: "Day43完成了失败门推演；Day44需要决定当前证据是否足以释放任何下一步权限。"
  relation_to_previous_day: "输入是Day43的变化专用失败门、Day37申请和Day35人工审批规则；今天不能把规划批准误当成执行批准。"
  concepts:
    - "最小权限：只释放完成下一安全步骤所必需的能力"
    - "隔离候选：在outputs中准备候选输入，不覆盖正式Day22配置"
    - "条件批准：准备获准不等于计算或执行获准"
    - "逐槽释放：Slot 2-6必须等待Slot 1证据完成并通过CP09人工审核"
  completion_standard: "审批只允许准备Day22隔离候选和清单；正式配置、ZOS-API、Slot1计算及Slot2-6执行继续锁定。"

