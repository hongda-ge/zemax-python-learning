# Day 42：把 Day41 的变化专用依赖波次转换为资源可行的教学调度槽。
schema_version: "change_specific_resource_schedule/v1"

case:
  id: "day42_day22_change_resource_schedule_v1"
  name: "Day22教学变化的资源可行复核调度"
  status: "draft"

teaching_introduction:
  why_today: "Day41只说明七个节点何时在依赖上就绪；Day42进一步加入ZOS-API和离线通道容量。"
  relation_to_previous_day: "输入是Day41的六个依赖波次；今天只能安排资源槽，不能修改Day22或执行任何复核节点。"
  concepts:
    - "资源容量：同一槽内每类任务允许占用的最大教学通道数"
    - "资源槽：表达资源约束下的执行先后组，不代表固定时长"
    - "容量拆分：同一依赖波次超过容量时，必须拆成多个连续子槽"
    - "人工释放：任务进入调度槽仍不等于获得执行许可"
  completion_standard: "七个节点恰好出现一次，来源波次顺序不倒退，每槽最多一个ZOS-API任务和两个离线任务；所有任务继续保持未释放。"

