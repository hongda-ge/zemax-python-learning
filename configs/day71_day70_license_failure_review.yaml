  id: "day71_day70_license_failure_review_v1"
  name: "Day70 ZOS-API许可证失败安全审核"
  status: "draft"

teaching_introduction:
  why_today: "Day70在建立Standalone连接时因许可证异常停止；Day71需要确认失败边界、安全状态和一次性授权状态，再决定是否允许申请重试。"
  relation_to_previous_day: "输入是Day70失败JSON、消费标记、未改变的工作副本和Day69审批；今天只审核失败，不连接Zemax。"
  concepts:
    - "失败分类：许可证连接失败与光学性能失败必须分开"
    - "失败前后边界：确认是否建立连接、是否产生分析、是否修改模型"
    - "一次性授权不可复用：原审批已消费，即使失败安全也必须重新授权"
    - "恢复报告与API验证分离：GUI恢复正常不等于Standalone许可证已重新验证"
  completion_standard: "确认Day70失败发生在光学分析前、无残留进程、模型与副本未变、授权已消费；审核允许申请新重试审批，但重试执行、七点批次和Slot 6仍锁定。"

