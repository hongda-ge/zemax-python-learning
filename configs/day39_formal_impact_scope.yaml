  concepts:
    - "直接下游：依赖图中由变化源直接指向的节点"
    - "传递下游：经过一条或多条依赖路径最终受到影响的节点"
    - "正式复核集合：变化源本身加全部传递下游，并按拓扑顺序排列"
    - "集合差异：用遗漏和多报分别检查申请人预估，而不是只看数量"
  completion_standard: "Day38审批、Day30依赖图和Day29注册表指纹有效；正式集合包含Day22及全部传递下游；申请人预估的遗漏和多报被明确列出；不执行任何复核任务。"

