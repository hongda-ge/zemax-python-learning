# Day 2 baseline definition for the Cooke triplet experiment.

schema_version: "baseline_case/v1"

case:
  id: "cooke_surface2_air_gap_v1"
  name: "Cooke面2空气间隔参数化优化"
  status: "draft"

# 配置未完全验收前，禁止自动执行。
execution:
  enabled: false

backend:
  name: "zemax"
  data_source: "real_zemax"
  mode: "standalone"

model:
  source_file: "models/Cooke 40 degree field.zmx"
  source_sha256: "A3F4BAA1433F36C7F363BBB1C7721D972854F2EC842E916EFC17DE2FF9A77585"
  working_copy: "outputs/day2_baseline_inspection/cooke_day2_baseline_v2.zmx"
  model_type: "sequential"
  read_only_original: true
  forbid_overwrite_original: true

outer_parameter:
  editor: "LDE"
  surface: 2
  property: "thickness"
  physical_meaning: "第一片与第二片镜片之间的空气间隔"
  unit: "mm"
  baseline_value: 6.0075511
  displayed_baseline_value: 6.008

  exploration:
    mode: "delta_from_baseline"
    deltas: [-1.0, -0.5, 0.0, 0.5, 1.0]
    values: [5.0075511, 5.5075511, 6.0075511, 6.5075511, 7.0075511]

  safety:
    medium: "air"
    hard_minimum: 1.0
    hard_maximum: 10.0
    reject_non_positive: true

system:
  effective_focal_length_mm: 50.0
  entrance_pupil_diameter_mm: 10.0
  working_f_number: 4.97822

  fields:
    type: "angle"
    unit: "degree"
    values:
      - field: 1
        x: 0.0
        y: 0.0
        weight: 1.0
      - field: 2
        x: 0.0
        y: 14.0
        weight: 1.0
      - field: 3
        x: 0.0
        y: 20.0
        weight: 1.0

  wavelengths:
    unit: "micrometer"
    values:
      - wavelength: 0.480
        weight: 0.8
      - wavelength: 0.550
        weight: 1.0
        primary: true
      - wavelength: 0.650
        weight: 0.8

inner_variables:
  status: "provisionally_approved"
  note: "V1采用基线附近的保守边界；完成真实敏感度检查前保持execution.enabled=false。"

  variables:
    - surface: 1
      property: "radius"
      baseline_value: 22.014
      physical_meaning: "第一片正透镜前表面曲率半径"
      unit: "mm"
      lower_bound: 19.8
      upper_bound: 24.2
      preserve_sign: true

    - surface: 5
      property: "radius"
      baseline_value: 79.684
      physical_meaning: "第三片正透镜前表面曲率半径"
      unit: "mm"
      lower_bound: 71.7
      upper_bound: 87.7
      preserve_sign: true

    - surface: 6
      property: "thickness"
      baseline_value: 42.208
      physical_meaning: "最后一个光学面到像面的距离，用于重新对焦"
      unit: "mm"
      lower_bound: 40.0
      upper_bound: 44.5
      preserve_sign: true

analysis:
  fft_mtf:
    type: "FFT_MTF"
    sampling: "64x64"
    maximum_frequency_cyc_per_mm: 100.0
    evaluation_frequencies_cyc_per_mm: [30.0, 50.0]
    fields: "all"
    wavelengths: "all"
    surface: "image"
    components: ["tangential", "sagittal"]
    polarization: false
    note: "最大频率由原模型的自动值0改为显式100，以保证案例间设置一致。"

  standard_spot:
    type: "Standard_Spot"
    ray_density: 6
    pattern: "hexapolar"
    fields: "all"
    wavelengths: "all"
    surface: "image"
    reference: "centroid"
    primary_metric: "rms_radius_um"
    diagnostic_metric: "geometric_radius_um"
    polarization: false

merit_function:
  generated_by: "OpticStudio Optimization Wizard"
  imaging_criterion: "spot_diagram"
  metric: "RMS"
  reference: "centroid"
  x_weight: 1.0
  y_weight: 1.0
  ignore_lateral_color: false
  optimization_goal: "best_nominal_performance"

  pupil_sampling:
    pattern: "hexapolar"
    rings: 20
    arms: 12
    obscuration: 0

  thickness_boundaries:
    glass:
      minimum_center_mm: 0.2
      maximum_center_mm: 10.0
      minimum_edge_mm: 0.2
    air:
      minimum_center_mm: 1.0
      maximum_center_mm: 1000.0
      minimum_edge_mm: 1.0

acceptance:
  require_source_hash_unchanged: true
  require_backend: "zemax"
  require_data_source: "real_zemax"
  reject_mock_results: true
  require_all_fields: true
  require_all_wavelengths: true
  require_raw_zemax_artifacts: true
