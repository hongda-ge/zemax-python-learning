# Day 30：审计 Day3-Day28 教学主线中的先修关系与科学证据依赖。
schema_version: "evidence_dependency_graph/v1"

case:
  id: "day30_teaching_evidence_dependency_graph_v1"
  name: "教学实验依赖图与证据追溯"
  status: "draft"

execution:
  enabled: false
  allow_zosapi_connection: false
  allow_model_copy: false
  allow_new_optical_calculation: false
  allow_graph_generation: true
  allow_source_file_modification: false

source:
  day29_registry_root: "outputs/day29_experiment_registry"
  day29_registry_name: "experiment_registry.json"
  expected_registered_day_count: 26
  expected_documentation_gaps: []

graph_scope:
