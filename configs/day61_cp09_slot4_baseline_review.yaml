teaching_introduction:
  why_today: "Day60已经消费一次ZOS-API授权；Day61需要确认零偏移结果完整、可复现且安全收尾，才能申请九点边界批次权限。"
  relation_to_previous_day: "输入是Day60结果、消费标记、Day59审批和历史Day25控制；今天只生成CP09审核结论，不连接Zemax。"
  concepts:
    - "授权闭环：审批、消费标记和结果必须绑定同一个决策编号与SHA256"
    - "证据完整性：结果JSON、Spot文本、MTF文本、模型指纹和连接状态必须互相一致"
    - "双重通过：历史零差复现与均衡四指标AND规则必须分别通过"
    - "门控分离：CP09审核通过只允许申请九点批次审批，不等于批次获准执行"
  completion_standard: "Day60严格消费一次授权，Spot/MTF完整复现且均衡规则通过，模型和工作副本未变、连接关闭；审核状态为PASS，但重跑、九点批次和Slot5-6仍锁定。"

