teaching_introduction:
  why_today: "Day73已经消费一次新授权并成功复现零偏移控制；Day74需要确认许可证恢复、光学复现和安全收尾构成完整证据链。"
  relation_to_previous_day: "输入是Day73结果、Day72审批、消费标记、Day71失败审核和四份原始证据；今天只生成CP09审核，不连接Zemax。"
  concepts:
    - "恢复闭环：将Day70连接失败、Day71安全审核和Day73成功重试串成可追溯链"
    - "授权闭环：审批、消费标记和结果必须绑定同一Day72决策与SHA256"
    - "双重恢复：许可证连接恢复与Spot/MTF基线复现必须分别通过"
    - "门控分离：审核PASS只允许申请七点批次审批，不等于批次已获准"
  completion_standard: "Day73只消费一次Day72授权，Standalone许可证有效，Spot/MTF零差复现，模型与副本不变且连接关闭；审核为PASS，但重跑、额外重试、七点批次、Day27重算和Slot 6仍锁定。"

