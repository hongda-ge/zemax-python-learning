teaching_introduction:
  why_today: "Day46已经证明候选可信；Day47需要以最小权限决定是否允许它执行一次Slot 1离线复核。"
  relation_to_previous_day: "输入是Day46候选审核记录、Day42资源槽和Day35人工槽门；今天只生成执行审批，不自动运行Day22。"
  concepts:
    - "执行授权：明确允许哪个冻结输入执行哪一个任务"
    - "运行契约：固定入口、输入、输出边界和停止条件"
    - "单槽释放：只释放Slot 1，不连带释放Slot 2-6"
    - "执行后再审批：Slot 1结果必须经过CP09人工审核才能影响下游"
  completion_standard: "审批绑定Day46记录和候选SHA256，只允许专用入口执行一次Day22离线复核；正式配置、ZOS-API和下游槽继续锁定，审批生成时不执行任务。"

